<!--Topics related to Images, Lists & Tables in HTML-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session-3</title>
</head>
<body>
    <!--Images in HTML-->
    <h3>This is Image in HTML : </h3>
    <img src="mountain.jpg" alt="Mountain Image" width="325" height="250">
    <hr>

    <!--Tables in HTML-->
    <!--tr command is for table rows-->
    <!--th will be for storage of heading of table-->
    <!--td command will store data of table-->
    <h3>This is table in HTML : </h3>
    <table style="border: solid;">
        <tr>
            <th><b>ID</b></th>
            <th><b>Name</b></th>
            <th><b>Branch</b></th>
        </tr>
        <tr>
            <td>1</td>
            <td>Harshvi</td>
            <td>IT</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Kreya</td>
            <td>CP</td>
        </tr>
    </table>
    <hr>

    <!--Caption in HTML-->
    <h3>This is Caption in HTML : </h3>
    <caption>Hello!! Welcome to Sigma Web Development.</caption>
</body>
</html>
